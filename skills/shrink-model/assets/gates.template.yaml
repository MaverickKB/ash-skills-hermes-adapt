# Quality and resource gates. Fill in before the pilot, then freeze.
# Record the SHA-256 of the frozen file in the run log.
# An edit after freezing is a new version, declared in the completion manifest with its reason.

version: 1
counting_convention: null   # one or two sentences, the same wording used in every report

budgets:                    # hard caps on the child
  max_total_params: null
  max_active_params: null   # MoE only

structural:                 # Gate B. Every line must hold
  manifest_check_passes: true
  inherited_values_not_compared: 0   # from the last line of check_manifest.py
  manifest_check_flags: []           # any flag that left values uncompared, such as --allow-dtype-change
  measured_count_equals_estimate: true
  identity_conversion:
    max_abs_logit_difference: null
    dtype: null             # the precision the tolerance was measured in
  finite_forward_and_backward: true
  routing_indices_valid: true
  reload_preserves_outputs: true

pilot:                      # Gate C, on the development split
  metric: null
  min_gain_over_pruned_child: null   # recovered score minus the score before recovery
  no_non_finite_loss: true
  resume_tested: true
  routing:                  # MoE only
    max_dead_expert_fraction: null
    min_entropy_relative_to_parent: null

final:                      # Gate D, on the sealed test, run once
  baseline_model: null      # strongest existing open model near the child's size
  tasks:
    - name: null
      metric: null
      min_retention_vs_parent: null   # child score divided by parent score
      must_match_or_beat_baseline: true
  general_regression:
    metric: null
    max_drop_vs_parent: null

resources:                  # measured on the deployment hardware at the requested context
  max_peak_memory_gb: null
  max_file_size_gb: null
  min_tokens_per_second: null
  max_time_to_first_token_seconds: null
